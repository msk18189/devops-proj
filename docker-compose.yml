services:
  # ---------------------------------------------------------------------------
  # PostgreSQL Database Service
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: streamops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-streaming_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-streaming_secure_password_replace_in_prod}
      POSTGRES_DB: ${POSTGRES_DB:-streaming_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-streaming_user} -d ${POSTGRES_DB:-streaming_db}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - streamops-network

  # ---------------------------------------------------------------------------
  # MinIO S3-Compatible Object Storage Service
  # ---------------------------------------------------------------------------
  minio:
    image: quay.io/minio/minio
    container_name: streamops-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minio_admin_user}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minio_admin_secure_password}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - streamops-network

  # ---------------------------------------------------------------------------
  # FastAPI Application Backend Service
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: streamops-backend
    restart: unless-stopped
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-streaming_user}:${POSTGRES_PASSWORD:-streaming_secure_password_replace_in_prod}@postgres:5432/${POSTGRES_DB:-streaming_db}
      - JWT_SECRET=${JWT_SECRET:-super_secret_jwt_key_replace_with_openssl_rand_hex_32}
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minio_admin_user}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minio_admin_secure_password}
      - MINIO_BUCKET=${MINIO_BUCKET:-videos}
      - MINIO_SECURE=false
      - MAX_VIDEO_SIZE_MB=500
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8000/api/health/live || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - streamops-network

  # ---------------------------------------------------------------------------
  # React NGINX Production Frontend Service
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: streamops-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    healthcheck:
      test: [ "CMD-SHELL", "wget -q --spider http://localhost:80/ || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - streamops-network

# ---------------------------------------------------------------------------
# Persistent Volumes
# ---------------------------------------------------------------------------
volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local

# ---------------------------------------------------------------------------
# Network
# ---------------------------------------------------------------------------
networks:
  streamops-network:
    driver: bridge
