server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Maximum upload size for video binaries (supports 500MB+ videos)
    client_max_body_size 600M;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;


    # Lightweight health endpoint for Kubernetes liveness & readiness probes
    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"healthy","service":"frontend"}\n';
    }

    # SPA routing fallback to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy for backend API in Docker Compose & local container environments
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable response buffering for low-latency chunked video streaming
        proxy_buffering off;
        proxy_request_buffering off;

        # Pass HTTP Range headers for partial content seeking
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;

        # Proxy timeouts for large uploads
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }
}
