apiVersion: v1
kind: Secret
metadata:
  name: streamops-secrets
  namespace: streamops
type: Opaque
stringData:
  POSTGRES_USER: "streaming_user"
  POSTGRES_PASSWORD: "streaming_secure_password_k8s"
  DATABASE_URL: "postgresql://streaming_user:streaming_secure_password_k8s@postgres-service:5432/streaming_db"
  JWT_SECRET: "k8s_production_jwt_secret_key_32_bytes_min"
  MINIO_ACCESS_KEY: "minio_admin_k8s"
  MINIO_SECRET_KEY: "minio_secure_password_k8s"
