apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: video-streaming
  labels:
    app: grafana
    app.kubernetes.io/part-of: streamops
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus-service:9090
        isDefault: true
        editable: true
        jsonData:
          timeInterval: 10s
