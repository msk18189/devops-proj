apiVersion: v1
kind: ConfigMap
metadata:
  name: streamops-config
  namespace: video-streaming
  labels:
    app.kubernetes.io/part-of: streamops
data:
  APP_ENV: "production"
  ENVIRONMENT: "production"
  POSTGRES_HOST: "postgres-service"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "streaming_db"
  MINIO_ENDPOINT: "minio-service:9000"
  MINIO_BUCKET: "videos"
  MINIO_SECURE: "false"
  MAX_VIDEO_SIZE_MB: "500"
  CORS_ORIGINS: "*"
