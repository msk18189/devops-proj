apiVersion: v1
kind: ConfigMap
metadata:
  name: streamops-config
  namespace: streamops
data:
  ENVIRONMENT: "production"
  POSTGRES_HOST: "postgres-service"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "streaming_db"
  MINIO_ENDPOINT: "minio-service:9000"
  MINIO_BUCKET: "video-stream-bucket"
  CORS_ORIGINS: "*"
