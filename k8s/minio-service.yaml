apiVersion: v1
kind: Service
metadata:
  name: minio-service
  namespace: video-streaming
  labels:
    app: minio
    app.kubernetes.io/part-of: streamops
spec:
  type: ClusterIP
  selector:
    app: minio
  ports:
    - name: s3-api
      port: 9000
      targetPort: 9000
    - name: console
      port: 9001
      targetPort: 9001
